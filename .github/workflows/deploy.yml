name: Deploy to GitHub Pages

on:
  push:
    branches: [ master, pastel-lantern ]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: VITE_ENABLE_SYNC=true npm run build

      - name: Deploy master to root
        if: github.ref == 'refs/heads/master'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
          clean-exclude: |
            pastel-lantern

      - name: Deploy pastel-lantern to subpath
        if: github.ref == 'refs/heads/pastel-lantern'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
          target-folder: pastel-lantern
