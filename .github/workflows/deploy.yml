name: Deploy to GitHub Pages

on:
  push:
    branches: [ master, pastel-lantern, firebase ]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # The shared-backend build needs its whole config or it cannot connect,
      # and a half-configured build does not fail — it comes up with an empty
      # season and a console warning nobody reads. Better to stop here.
      #
      # Only the API key is a repository secret. The rest identify the
      # project rather than authorise anything — firestore.rules is the real
      # access boundary — so they are inlined below rather than kept as five
      # more secrets to manage. See .env.example.
      - name: Check the Firebase config is present
        if: github.ref == 'refs/heads/firebase'
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
        run: |
          missing=""
          for v in VITE_FIREBASE_API_KEY; do
            [ -n "$(printenv "$v")" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "Missing repository secrets:$missing"
            exit 1
          fi

      - name: Build
        # The config is injected for every branch and only USED by a build that
        # asks for the firebase backend. On master and pastel-lantern the vars
        # are empty and nothing reads them, so those builds are unchanged.
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: warroomsuite.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: warroomsuite
          VITE_FIREBASE_APP_ID: "1:244261605876:web:ec3d9c58c61f4a263229a1"
          VITE_FIREBASE_STORAGE_BUCKET: warroomsuite.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID: "244261605876"
        run: |
          if [ "$GITHUB_REF" = "refs/heads/firebase" ]; then
            VITE_BACKEND=firebase VITE_ENABLE_SYNC=true npm run build
          else
            VITE_ENABLE_SYNC=true npm run build
          fi

      - name: Deploy master to root
        if: github.ref == 'refs/heads/master'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
          clean-exclude: |
            pastel-lantern
            firebase

      - name: Deploy pastel-lantern to subpath
        if: github.ref == 'refs/heads/pastel-lantern'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
          target-folder: pastel-lantern

      # Its own subpath, so the shared-backend build can be looked at without
      # replacing the one people use.
      - name: Deploy firebase to subpath
        if: github.ref == 'refs/heads/firebase'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
          target-folder: firebase
