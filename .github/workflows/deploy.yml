name: Deploy to GitHub Pages

on:
  push:
    branches: [ master, pastel-lantern, firebase ]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # The shared-backend build needs its whole config or it cannot connect,
      # and a half-configured build does not fail — it comes up with an empty
      # season and a console warning nobody reads. Better to stop here.
      #
      # Only the API key is a repository secret. The rest identify the
      # project rather than authorise anything — firestore.rules is the real
      # access boundary — so they are inlined below rather than kept as five
      # more secrets to manage. See .env.example.
      - name: Check the Firebase config is present
        if: github.ref == 'refs/heads/firebase'
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
        run: |
          missing=""
          for v in VITE_FIREBASE_API_KEY; do
            [ -n "$(printenv "$v")" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "Missing repository secrets:$missing"
            exit 1
          fi

      - name: Build
        # The config is injected for every branch and only USED by a build that
        # asks for the firebase backend. On master and pastel-lantern the vars
        # are empty and nothing reads them, so those builds are unchanged.
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: warroomsuite.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: warroomsuite
          VITE_FIREBASE_APP_ID: "1:244261605876:web:ec3d9c58c61f4a263229a1"
          VITE_FIREBASE_STORAGE_BUCKET: warroomsuite.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID: "244261605876"
        run: |
          if [ "$GITHUB_REF" = "refs/heads/firebase" ]; then
            VITE_BACKEND=firebase VITE_ENABLE_SYNC=true npm run build
          else
            VITE_ENABLE_SYNC=true npm run build
          fi

      # The shared backend is the source of truth, so the seed CSVs must not
      # reach it.
      #
      # Every one of them is a fixture of the 2026 season: the three rankings
      # files, the facts, the three roster snapshots, the completed draft and
      # the example evaluations. On a local-only build they are how the app
      # bootstraps and they are correct. Against Firestore they are a SECOND
      # authority, and every client that boots tries to write them up — which
      # is refused for a viewer, kept locally anyway, and leaves each browser
      # holding its own private copy of a board that the database never had.
      # That is what produced a blank consensus board, boards whose placements
      # only existed on one machine, and a draft reporting itself complete with
      # nobody picked.
      #
      # Withholding the files is deliberately the whole mechanism: loadFiles
      # catches a failed fetch and caches null, playerFacts treats an empty
      # body as no rows, and seedBoard does nothing without a pool. No seeding
      # code changes, nothing to keep in sync with a flag.
      #
      # Data gets in through scripts/seed-firestore.mjs instead — once, from
      # outside, with credentials that may actually write it.
      #
      # The rankings files STAY, and the reason is worth writing down.
      #
      # useDraftState builds the Draft and UDFA pool straight from the
      # rankings CSV and has no other source — useBoardRankings rebuilds a
      # seeded board's pool from its entries, but the draft never got that
      # treatment, so withholding the file left it with no players at all: no
      # positions, no columns, a blank board. Two independent pool builders,
      # one following "storage is the truth" and one not. Until the draft is
      # moved onto the same derivation, its file has to be there.
      #
      # This does NOT reopen the seeding hole, because seeding is gated on
      # the DATA and not on the file: every board in Firestore now carries
      # seeded=true, so loadFiles skips the fetch for them, seedBoard returns
      # early, and openBoards finds boards and does nothing. The danger was
      # ever only an unseeded database next to a shipped file. Read by the
      # draft, written from by nobody.
      #
      # picks.txt still goes. It looks like configuration and is not:
      # parsePicks feeds seedKCLeft, which lands in the draft state that gets
      # written, so it seeds records like the CSVs do. Its fetch is the one
      # that does not check res.ok, but parsePicks keeps only finite positive
      # integers, so a 404 body parses to an empty list — no picks owned,
      # which is the right answer for a backend that is populated from
      # outside.
      #
      # columns.txt stays: it is read into setColumnOrder and never persisted,
      # so it is render-time layout and writes nothing. USER_GUIDE.md stays
      # because the Help button renders it, and the audio is the draft chime.
      - name: Withhold the seed CSVs from the shared-backend build
        if: github.ref == 'refs/heads/firebase'
        run: |
          rm -f dist/player_facts_2026.csv \
                dist/roster.csv dist/roster.old.csv \
                dist/roster_2025_end.csv dist/roster_predraft.csv \
                dist/DraftBoard_Picks.csv dist/DraftBoard_Picks.old.csv \
                dist/evaluations_kc_2026.csv \
                dist/picks.txt
          echo "Remaining in dist:"
          ls dist

      - name: Deploy master to root
        if: github.ref == 'refs/heads/master'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
          clean-exclude: |
            pastel-lantern
            firebase

      - name: Deploy pastel-lantern to subpath
        if: github.ref == 'refs/heads/pastel-lantern'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
          target-folder: pastel-lantern

      # Its own subpath, so the shared-backend build can be looked at without
      # replacing the one people use.
      - name: Deploy firebase to subpath
        if: github.ref == 'refs/heads/firebase'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
          target-folder: firebase
